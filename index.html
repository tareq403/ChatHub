<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ChatHub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <button class="nav-btn" data-service="gemini" data-tooltip="Gemini">
                <img src="https://unpkg.com/@lobehub/icons-static-svg@latest/icons/gemini.svg" alt="Gemini" class="icon">
            </button>
            <button class="nav-btn" data-service="chatgpt" data-tooltip="ChatGPT">
                <img src="https://unpkg.com/@lobehub/icons-static-svg@latest/icons/openai.svg" alt="ChatGPT" class="icon">
            </button>
            <button class="nav-btn" data-service="claude" data-tooltip="Claude">
                <img src="https://unpkg.com/@lobehub/icons-static-svg@latest/icons/claude.svg" alt="Claude" class="icon">
            </button>
            <button class="nav-btn" data-service="grok" data-tooltip="Grok">
                <img src="https://unpkg.com/@lobehub/icons-static-svg@latest/icons/grok.svg" alt="Grok" class="icon">
            </button>
            <button class="nav-btn" data-service="deepseek" data-tooltip="DeepSeek">
                <img src="https://unpkg.com/@lobehub/icons-static-svg@latest/icons/deepseek.svg" alt="DeepSeek" class="icon">
            </button>
        </aside>
        <main class="content">
            <div id="welcome-screen">
                <h1>Welcome to ChatHub</h1>
                <p>Select an AI tool from the left to start chatting.</p>
            </div>
        </main>
    </div>
    <script src="renderer.js"></script>
</body>
</html>
